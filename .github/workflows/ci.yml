name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Les tests ne demandent ni réseau ni Electron : ils travaillent dans un dossier
    # temporaire. Le build de l'app, lui, est macOS seulement (voir scripts/build-app.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
